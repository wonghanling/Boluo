# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# 2026-09-23：在 GitHub 上 npm ci + next build，只把 standalone 包传到 Azure。
# 旧写法把整仓源码丢给 Azure 远程编译，每次 12–30+ 分钟。

name: Build and deploy Node.js app to Azure Web App - boluoing-hk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (standalone)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ainivxbtlegfnzjpmecq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFpbml2eGJ0bGVnZm56anBtZWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEyNzY5MjAsImV4cCI6MjA3Njg1MjkyMH0.xyDQLb-NxP1SlhF2uOulFMgMuLX1ySNWbPVaMDKnX-0
          NEXT_PUBLIC_BASE_URL: https://boluoing.com
          NEXT_PUBLIC_SITE_URL: https://boluoing.com
          NEXT_PUBLIC_SITE_NAME: BoLuo
          ALIPAY_APP_ID: dummy_for_build
          ALIPAY_PRIVATE_KEY: dummy_for_build
          ALIPAY_PUBLIC_KEY: dummy_for_build
          RELOGRADE_API_KEY: dummy_for_build
          SUPABASE_SERVICE_ROLE_KEY: dummy_for_build

      - name: Assemble standalone deploy folder
        run: |
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/
          if [ -d public ]; then cp -r public deploy/; fi
          printf '%s\n' '[config]' 'SCM_DO_BUILD_DURING_DEPLOYMENT=false' > deploy/.deployment
          rm -f deploy/package.json deploy/package-lock.json

      - name: Zip standalone artifact
        run: cd deploy && zip -r ../release.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_73945A58E1A941BBA89A7437641F5685 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6AD02ADA0651438E9DE9EFBC8FBABF98 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DA09455155FF49DC9837D3793E388368 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'boluoing-hk'
          slot-name: 'Production'
          package: release.zip
